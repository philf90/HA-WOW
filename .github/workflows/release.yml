# Legt ein GitHub-Release an; HACS zeigt dessen Version an.
# Start: Tag "v*" pushen oder den Workflow von Hand starten. Beim Start von Hand
# wird der Tag aus der Version in manifest.json gebildet und mit angelegt.
# Die Versionshinweise stehen in .github/release-notes/<tag>.md. Gibt es das
# Release schon, ersetzt ein erneuter Start nur dessen Versionshinweise.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag aus manifest.json bestimmen
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/wow_character/manifest.json'))['version'])")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json nennt $version, der Tag ist $GITHUB_REF_NAME"
            exit 1
          fi
          test -f ".github/release-notes/$tag.md" || { echo "Versionshinweise .github/release-notes/$tag.md fehlen"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Release anlegen oder Hinweise aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Gibt es das Release schon, werden nur die Versionshinweise ersetzt
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file ".github/release-notes/$TAG.md"
          else
            gh release create "$TAG" \
              --title "WoW Charakter $TAG" \
              --notes-file ".github/release-notes/$TAG.md" \
              --target "$GITHUB_SHA"
          fi
